<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Checker & Text Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Vowel Checker</h1>
        <p class="subtitle">Live vowel frequency detector & character counter</p>

        <div class="vowel-badges">
            <div class="vowel-pill">
                <span class="vowel-letter">A</span>
                <span class="vowel-count" id="count-a">0</span>
            </div>
            <div class="vowel-pill">
                <span class="vowel-letter">E</span>
                <span class="vowel-count" id="count-e">0</span>
            </div>
            <div class="vowel-pill">
                <span class="vowel-letter">I</span>
                <span class="vowel-count" id="count-i">0</span>
            </div>
            <div class="vowel-pill">
                <span class="vowel-letter">O</span>
                <span class="vowel-count" id="count-o">0</span>
            </div>
            <div class="vowel-pill">
                <span class="vowel-letter">U</span>
                <span class="vowel-count" id="count-u">0</span>
            </div>
        </div>

        <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>

        <div class="sample-row">
            <span>Quick Samples:</span>
            <span class="sample-tag" onclick="setSampleText('Hello World')">Hello World</span>
            <span class="sample-tag" onclick="setSampleText('The quick brown fox jumps over the lazy dog')">Pangram</span>
            <span class="sample-tag" onclick="setSampleText('AEIOU and Sometimes Y')">All Vowels</span>
        </div>

        <div class="action-bar">
            <button onclick="checkVowels()">Check Vowels</button>
            <button class="btn-clear" onclick="clearText()">Clear</button>
        </div>

        <p id="result">Total Vowels: 0</p>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">Words</span>
                <span class="stat-val" id="count-words">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Characters</span>
                <span class="stat-val" id="count-chars">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Consonants</span>
                <span class="stat-val" id="count-consonants">0</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
